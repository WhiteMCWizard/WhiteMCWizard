<svg xmlns="http://www.w3.org/2000/svg" width="500" height="220" viewBox="0 0 500 220">
  <style>
    svg:hover #box {
      transform: translateY(-40px);
      fill: #f85149;
    }

    #box {
      fill: #58a6ff;
      transition: all 0.3s ease;
      transform-origin: center;
    }

    .btn {
      fill: #238636;
    }

    .btn-text {
      fill: white;
      font: 700 18px system-ui, sans-serif;
      pointer-events: none;
    }
  </style>

  <g id="button">
    <rect class="btn" x="320" y="85" width="130" height="55" rx="12"/>
    <text class="btn-text" x="385" y="120" text-anchor="middle">Hover image</text>
  </g>

  <rect id="box" x="60" y="90" width="60" height="60" rx="12"/>
</svg>
