<svg xmlns="http://www.w3.org/2000/svg" width="674" height="190" viewBox="0 0 674 190" fill="none" role="img" aria-label="Page under construction">
  <defs>
    <style type="text/css"><![CDATA[
      @keyframes boot{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
      @keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .card{animation:boot .55s cubic-bezier(.2,.7,.2,1) .1s both;transform-box:fill-box;transform-origin:center}
      .bar{animation:slide .55s cubic-bezier(.2,.7,.2,1) .35s both}
      .title{animation:slide .55s cubic-bezier(.2,.7,.2,1) .5s both}
      .sub{animation:slide .55s cubic-bezier(.2,.7,.2,1) .68s both}
      .blink{animation:pulse 1.4s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){.card,.bar,.title,.sub,.blink{animation:none;opacity:1;transform:none}}
    ]]></style>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g class="card">
    <rect x="4" y="4" width="666" height="182" rx="16" fill="#15161e" stroke="#262839" stroke-width="1" filter="url(#sh)"/>

    <rect class="bar" x="30" y="40" width="5" height="110" rx="2.5" fill="#e0af68"/>

    <text class="title" x="60" y="78"
      font-family="'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif"
      font-weight="700" font-size="30" fill="#e8ebf6">
      Page under construction
    </text>

    <text class="sub" x="60" y="108"
      font-family="'SFMono-Regular','SF Mono','Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace"
      font-size="15" fill="#6b7394">
      currently building this section
    </text>

    <g transform="translate(60 128)">
      <rect width="260" height="24" rx="8" fill="#20222e" stroke="#2c2f40"/>
      <text x="16" y="16"
        font-family="'SFMono-Regular','SF Mono','Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace"
        font-size="13" fill="#7dcfff">
        status:
      </text>
      <text class="blink" x="78" y="16"
        font-family="'SFMono-Regular','SF Mono','Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace"
        font-size="13" fill="#e0af68">
        work in progress
      </text>
    </g>
  </g>
</svg>