<svg xmlns="http://www.w3.org/2000/svg" width="500" height="220" viewBox="0 0 500 220">
    <style>
        .btn {
        fill: #238636;
        cursor: pointer;
        }

        .btn-text {
        fill: white;
        font: 700 18px system-ui, sans-serif;
        pointer-events: none;
        }

        .box {
        fill: #58a6ff;
        }
    </style>

    <!-- object that will animate -->
    <rect id="box" class="box" x="40" y="80" width="70" height="70" rx="12"/>

    <!-- clickable button -->
    <g id="button">
        <rect class="btn" x="320" y="85" width="130" height="55" rx="12"/>
        <text class="btn-text" x="385" y="120" text-anchor="middle">Click me</text>
    </g>

    <!-- animation triggered by button click -->
    <animate
        href="#box"
        attributeName="x"
        from="40"
        to="210"
        dur="0.6s"
        begin="button.click"
        fill="freeze"
        />

    <animate
        href="#box"
        attributeName="fill"
        from="#58a6ff"
        to="#f85149"
        dur="0.6s"
        begin="button.click"
        fill="freeze"
        />
    </svg>
